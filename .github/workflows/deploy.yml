name: Publicar imagenes de Docker Hub
on:
  push:
    branches: ["main", "master"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name : Escaneo de seguridad con (bandit)
        run: bandit -r . -s B101 # Ignorar los archivos test

      - name: Ejecutar pruebas pytest
        run: pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir  iamgen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: shofis05/sampleapp:v1

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shofis05/sampleapp:v1
          format: 'table'
          exit-code: '1' # Si se encuentra alguna falla , rompe la ejecucion
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity:: 'CRITICAL,HIGH' # Son los que van a detener la ejecucion
      
      - name: Subir imagen a Docker Hub
        uses: docker/build-push-action@v4


      - name: Desplegar en el servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST}}
          username: ${{ secrets.SERVER_USER}}
          key: ${{ secrets.SERVER_SSH_KEY}}
          script: |
            cd ~/Docker_Sofi
            docker compose pull backend
            docker compose up -d
