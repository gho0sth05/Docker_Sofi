version: '3.8'

services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80" # Http
      - "81:81" # Administración de la API
      - "443:443" # Https
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - red-cba

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd-082
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-cba
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psena123"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-backend:
    image: shofis05/sampleapp:v1
    container_name: backend-082
    restart: always
    ports:
      - "5051:5051"
    environment:
      - DB_HOST=servidor-bd
      - DB_USER=root
      - DB_PASSWORD=sena123
      - DB_NAME=082_db
      - FLASK_ENV=development
    networks:
      - red-cba
    depends_on:
      - servidor-bd

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - red-cba

networks:
  red-cba:
    name: red-cba-ejemplo

volumes:
  mysql-data:
    name: mysql-data
  uptime-kuma-data:
    name: uptime-kuma-data